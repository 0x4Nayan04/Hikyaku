name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhooks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U webhook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6388:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://webhook:webhook@localhost:5432/webhooks_test
      REDIS_URL: redis://localhost:6388/15
      TEST_DATABASE_URL: postgresql://webhook:webhook@localhost:5432/webhooks_test
      TEST_REDIS_URL: redis://localhost:6388/15
      TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      ADMIN_BOOTSTRAP_SECRET: test-admin-secret
      SESSION_SECRET: test-session-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm db:migrate

      - run: pnpm test:unit

      - run: pnpm test:integration

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      # Unit/integration share webhooks_test + Redis db 15; flush so bootstrap sees zero users
      # and auth rate-limit keys do not leak into smoke.
      - name: Reset smoke test inputs
        working-directory: apps/api
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          import Redis from 'ioredis'

          const redis = new Redis(process.env.TEST_REDIS_URL)
          await redis.flushdb()
          await redis.quit()

          const client = new pg.Client({ connectionString: process.env.TEST_DATABASE_URL })
          await client.connect()
          await client.query(`
            TRUNCATE delivery_attempts, delivery_outbox, deliveries, events, endpoints,
                     api_keys, invites, sessions, users, tenants
            RESTART IDENTITY CASCADE
          `)
          await client.end()
          console.log('smoke inputs reset')
          EOF

      - run: pnpm test:smoke e2e/00-onboarding.spec.ts

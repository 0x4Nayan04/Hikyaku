<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 820" role="img" aria-labelledby="title desc">
<title id="title">Data model</title>
<desc id="desc">A tenant groups users, API keys, invites, endpoints, events, deliveries and outbox records. Users and invites may have no tenant; an invite may have no creator. Each delivery belongs to an event and an endpoint and can have multiple attempts and at most one outbox record. Sessions store JSON separately and have no user foreign key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e3a5f}.heading{font-size:22px;font-weight:700}.section{font-size:16px;font-weight:700}.name{font-size:16px;font-weight:650}.small{font-size:13px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.panel{fill:#f6f8fb;stroke:#d6dee8}.line{fill:none;stroke:#2563a8;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="740" height="820" fill="white"/>
<text x="28" y="38" class="heading">Data model</text>
<text x="28" y="64" class="small">How the main database records relate to each other</text>

<rect x="28" y="88" width="684" height="220" rx="9" class="panel"/>
<text x="48" y="117" class="section">Workspace records</text>
<rect x="48" y="139" width="150" height="46" rx="7" class="node"/>
<text x="123" y="168" text-anchor="middle" class="name">tenants</text>
<text x="220" y="158" class="small">A tenant groups users, API keys, invites, endpoints and events.</text>
<text x="220" y="179" class="small">Deliveries and outbox records also belong to a tenant.</text>
<text x="48" y="224" class="small">A user or invite can exist without a tenant.</text>
<text x="48" y="248" class="small">An invite may also have a user who created it.</text>
<text x="48" y="281" class="small">One tenant can have many records of each type.</text>

<text x="28" y="353" class="section">Delivery records</text>
<text x="28" y="376" class="small">Each delivery connects one event to one endpoint.</text>
<text x="28" y="395" class="small">One event or endpoint can have many deliveries.</text>
<rect x="48" y="410" width="180" height="52" rx="7" class="node"/>
<text x="138" y="442" text-anchor="middle" class="name">events</text>
<rect x="512" y="410" width="180" height="52" rx="7" class="node"/>
<text x="602" y="442" text-anchor="middle" class="name">endpoints</text>
<path class="line" d="M138 462V489H284"/><path class="line" d="M602 462V489H456"/>
<rect x="284" y="464" width="172" height="52" rx="7" class="node"/>
<text x="370" y="496" text-anchor="middle" class="name">deliveries</text>
<path class="line" d="M330 516V584H278"/><path class="line" d="M410 516V584H462"/>
<rect x="48" y="559" width="230" height="52" rx="7" class="node"/>
<text x="163" y="591" text-anchor="middle" class="name">delivery_attempts</text>
<rect x="462" y="559" width="230" height="52" rx="7" class="node"/>
<text x="577" y="591" text-anchor="middle" class="name">delivery_outbox</text>
<text x="163" y="637" text-anchor="middle" class="small">Zero or more attempts</text>
<text x="577" y="637" text-anchor="middle" class="small">Zero or one outbox record</text>
<text x="370" y="666" text-anchor="middle" class="small">Each attempt and outbox record belongs to one delivery.</text>

<rect x="28" y="705" width="684" height="87" rx="9" class="panel"/>
<rect x="48" y="724" width="150" height="46" rx="7" class="node"/>
<text x="123" y="753" text-anchor="middle" class="name">sessions</text>
<text x="220" y="742" class="small">Stores session data as JSON.</text>
<text x="220" y="763" class="small">It has no direct database link to users.</text>
</svg>

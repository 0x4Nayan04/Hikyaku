<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 660" role="img" aria-labelledby="title desc">
<title id="title">Components</title><desc id="desc">The console sends session requests to the API. The API writes events, deliveries and outbox entries to PostgreSQL and publishes jobs to Redis. The worker consumes and recovers jobs, reads and writes PostgreSQL, and sends signed POST requests to the receiver.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#0f172a} .heading{font-size:22px;font-weight:700;fill:#1e3a5f} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .name{font-size:16px;font-weight:650;fill:#1e3a5f} .small{font-size:13px;fill:#475569} .label{font-size:13px;fill:#1e3a5f} .line{fill:none;stroke:#2563a8;stroke-width:1.7;marker-end:url(#arrow)} .rel{fill:none;stroke:#64748b;stroke-width:1.4} .life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 5}</style>
<rect width="740" height="660" fill="white"/>
<text x="28" y="38" class="heading">Components</text>
<rect class="node" x="280" y="65" width="180" height="52" rx="7"/><text class="name" x="370.0" y="91.0" text-anchor="middle" dominant-baseline="middle">Console</text>
<rect class="node" x="280" y="160" width="180" height="52" rx="7"/><text class="name" x="370.0" y="186.0" text-anchor="middle" dominant-baseline="middle">API</text>
<rect class="node" x="45" y="298" width="190" height="60" rx="7"/><text class="name" x="140.0" y="328.0" text-anchor="middle" dominant-baseline="middle">PostgreSQL</text>
<rect class="node" x="505" y="298" width="190" height="60" rx="7"/><text class="name" x="600.0" y="328.0" text-anchor="middle" dominant-baseline="middle">Redis / BullMQ</text>
<rect class="node" x="280" y="438" width="180" height="52" rx="7"/><text class="name" x="370.0" y="464.0" text-anchor="middle" dominant-baseline="middle">Worker</text>
<rect class="node" x="280" y="580" width="180" height="52" rx="7"/><text class="name" x="370.0" y="606.0" text-anchor="middle" dominant-baseline="middle">Receiver</text>
<path class="line" d="M370 117V160"/>
<text class="label" x="382" y="143" text-anchor="start">Session requests</text>
<path class="line" d="M310 212V250H140V298"/>
<text class="label" x="226" y="239" text-anchor="middle">Events, deliveries, outbox</text>
<path class="line" d="M430 212V250H600V298"/>
<text class="label" x="536" y="239" text-anchor="middle">Publish jobs</text>
<path class="line" d="M505 328H470V464H460"/>
<text class="label" x="485" y="391" text-anchor="end">Delivery jobs</text>
<path class="line" d="M280 464H140V358"/>
<text class="label" x="200" y="452" text-anchor="middle">Recover + record</text>
<path class="line" d="M460 474H600V358"/>
<text class="label" x="540" y="465" text-anchor="middle">Recover jobs</text>
<path class="line" d="M370 490V580"/>

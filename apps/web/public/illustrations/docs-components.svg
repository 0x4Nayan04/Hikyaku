<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 465" role="img" aria-labelledby="title desc">
<title id="title">Components</title>
<desc id="desc">Console to API: Session requests; API to PostgreSQL: Events, deliveries, outbox; API to Redis / BullMQ: Publish jobs; Worker to PostgreSQL: Recover and record; Worker to Redis / BullMQ: Consume / recover jobs; Worker to Receiver: Signed HTTP</desc>

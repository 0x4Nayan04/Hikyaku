<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 870" role="img" aria-labelledby="title desc">
<title id="title">Ingest and recovery</title>
<desc id="desc">The client sends an event to the API, which saves the event, deliveries and outbox records in PostgreSQL before publishing jobs to Redis. If the queue accepts the jobs, the API removes the outbox records and returns 202. If publishing fails, the API returns 503 even though the transaction may already be committed. A worker sweeper can enqueue the remaining outbox records and remove them after enqueue. The worker sends signed HTTP requests and records outcomes. Delivery is at least once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e3a5f}.heading{font-size:22px;font-weight:700}.section{font-size:16px;font-weight:700}.name{font-size:15px;font-weight:650}.small{font-size:13px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.panel{fill:#f6f8fb;stroke:#d6dee8}.line{fill:none;stroke:#2563a8;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="740" height="870" fill="white"/>
<text x="28" y="38" class="heading">Ingest and recovery</text>
<text x="28" y="64" class="small">From an event request to a signed delivery</text>

<text x="28" y="108" class="section">1. Save the event</text>
<rect x="28" y="126" width="170" height="70" rx="7" class="node"/>
<text x="113" y="151" text-anchor="middle" class="name">Client</text><text x="113" y="173" text-anchor="middle" class="small">POST /v1/events</text>
<rect x="285" y="126" width="170" height="70" rx="7" class="node"/>
<text x="370" y="151" text-anchor="middle" class="name">API</text><text x="370" y="173" text-anchor="middle" class="small">Key or session</text>
<rect x="542" y="126" width="170" height="70" rx="7" class="node"/>
<text x="627" y="151" text-anchor="middle" class="name">PostgreSQL</text><text x="627" y="173" text-anchor="middle" class="small">Save transaction</text>
<path d="M198 161H285" class="line"/><path d="M455 161H542" class="line"/>
<text x="28" y="225" class="small">The transaction saves the event, its deliveries and outbox records together.</text>
<text x="28" y="248" class="small">No active endpoints: the event is marked no_recipients, with zero deliveries.</text>

<text x="28" y="298" class="section">2. Publish delivery jobs</text>
<text x="28" y="322" class="small">After the transaction commits, the API sends jobs to Redis / BullMQ.</text>
<rect x="28" y="344" width="330" height="153" rx="8" class="panel"/>
<text x="48" y="373" class="section">Queue accepts</text>
<text x="48" y="402" class="small">The API removes the outbox records</text>
<text x="48" y="422" class="small">for the queued jobs and returns 202.</text>
<text x="48" y="467" class="small">Jobs are ready for the worker.</text>
<rect x="382" y="344" width="330" height="153" rx="8" class="panel"/>
<text x="402" y="373" class="section">Publish fails</text>
<text x="402" y="402" class="small">The API returns 503. The transaction</text>
<text x="402" y="422" class="small">may already have been committed.</text>
<text x="402" y="467" class="small">Outbox records remain for recovery.</text>

<path d="M547 497V528" class="line"/>
<rect x="382" y="529" width="330" height="111" rx="8" class="node"/>
<text x="402" y="558" class="section">Recovery</text>
<text x="402" y="584" class="small">The worker's sweeper reads the outbox,</text>
<text x="402" y="604" class="small">enqueues jobs, then removes those records.</text>

<text x="28" y="690" class="section">3. Deliver and record the result</text>
<rect x="28" y="710" width="170" height="64" rx="7" class="node"/>
<text x="113" y="737" text-anchor="middle" class="name">Redis / BullMQ</text><text x="113" y="758" text-anchor="middle" class="small">Delivery job</text>
<rect x="285" y="710" width="170" height="64" rx="7" class="node"/>
<text x="370" y="737" text-anchor="middle" class="name">Worker</text><text x="370" y="758" text-anchor="middle" class="small">Signed HTTP</text>
<rect x="542" y="710" width="170" height="64" rx="7" class="node"/>
<text x="627" y="747" text-anchor="middle" class="name">Receiver</text>
<path d="M198 742H285" class="line"/><path d="M455 742H542" class="line"/>
<text x="28" y="811" class="small">The worker records the attempt and outcome in PostgreSQL.</text>
<text x="28" y="835" class="small">Delivery is at least once: a receiver may get the same event more than once.</text>
</svg>

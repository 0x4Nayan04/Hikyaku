<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 900" role="img" aria-labelledby="title desc">
<title id="title">Ingest and recovery</title><desc id="desc">Sequence from client through API, PostgreSQL, Redis queue, worker and receiver. The API commits the event, deliveries and outbox before publishing. If publishing fails, a 503 can follow a committed transaction; the worker sweeps the outbox and republishes. Delivery is signed and at least once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#0f172a} .heading{font-size:22px;font-weight:700;fill:#1e3a5f} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .name{font-size:16px;font-weight:650;fill:#1e3a5f} .small{font-size:13px;fill:#475569} .label{font-size:13px;fill:#1e3a5f} .line{fill:none;stroke:#2563a8;stroke-width:1.7;marker-end:url(#arrow)} .rel{fill:none;stroke:#64748b;stroke-width:1.4} .life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 5}</style>
<rect width="740" height="900" fill="white"/>
<text x="28" y="38" class="heading">Ingest and recovery</text>
<text class="name" x="55" y="77" text-anchor="middle">Client</text>
<line class="life" x1="55" y1="91" x2="55" y2="874"/>
<text class="name" x="165" y="77" text-anchor="middle">API</text>
<line class="life" x1="165" y1="91" x2="165" y2="874"/>
<text class="name" x="280" y="77" text-anchor="middle">PostgreSQL</text>
<line class="life" x1="280" y1="91" x2="280" y2="874"/>
<text class="name" x="395" y="77" text-anchor="middle">Redis / BullMQ</text>
<line class="life" x1="395" y1="91" x2="395" y2="874"/>
<text class="name" x="510" y="77" text-anchor="middle">Worker</text>
<line class="life" x1="510" y1="91" x2="510" y2="874"/>
<text class="name" x="665" y="77" text-anchor="middle">Receiver</text>
<line class="life" x1="665" y1="91" x2="665" y2="874"/>
<path d="M55 125H165" class="line"/><text class="label" x="110.0" y="117" text-anchor="middle">POST /v1/events</text>
<text class="small" x="110" y="145" text-anchor="middle">key or session</text>
<path d="M165 184H280" class="line"/><text class="label" x="222.5" y="176" text-anchor="middle">Transaction: event, deliveries, outbox</text>
<rect x="202" y="205" width="302" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/><text class="small" x="353" y="225" text-anchor="middle">No active endpoints: no_recipients</text>
<text class="small" x="353" y="243" text-anchor="middle">and zero deliveries</text>
<path d="M165 289H395" class="line"/><text class="label" x="280.0" y="281" text-anchor="middle">Publish jobs after commit</text>
<rect x="20" y="315" width="540" height="158" rx="6" fill="none" stroke="#94a3b8"/><text x="32" y="337" class="name">Queue accepts</text><path d="M165 375H280" class="line"/><text class="label" x="222.5" y="367" text-anchor="middle">Delete outbox rows</text>
<path d="M165 433H55" class="line" stroke-dasharray="5 4"/><text class="label" x="110.0" y="425" text-anchor="middle">202 accepted</text>
<rect x="20" y="491" width="540" height="244" rx="6" fill="none" stroke="#94a3b8"/><text x="32" y="513" class="name">Publish fails</text><path d="M165 550H55" class="line" stroke-dasharray="5 4"/><text class="label" x="110.0" y="542" text-anchor="middle">503; transaction may be committed</text>
<path d="M510 592H280" class="line"/><text class="label" x="395.0" y="584" text-anchor="middle">Sweeper reads outbox</text>
<path d="M510 638H395" class="line"/><text class="label" x="452.5" y="630" text-anchor="middle">Republish jobs</text>
<path d="M510 684H280" class="line"/><text class="label" x="395.0" y="676" text-anchor="middle">Delete outbox after enqueue</text>
<path d="M395 766H510" class="line"/><text class="label" x="452.5" y="758" text-anchor="middle">Delivery job</text>
<path d="M510 810H665" class="line"/><text class="label" x="587.5" y="802" text-anchor="middle">Signed HTTP</text>
<text class="small" x="588" y="828" text-anchor="middle">at least once</text>
<path d="M510 862H280" class="line"/><text class="label" x="395.0" y="854" text-anchor="middle">Record outcome / attempt</text>
</svg>

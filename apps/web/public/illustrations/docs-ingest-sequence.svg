<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 621" role="img" aria-labelledby="title desc">
<title id="title">Ingest and recovery</title>
<desc id="desc">Client to API: POST /v1/events: key or session; API to PostgreSQL: Transaction: event + deliveries + outbox; API to Redis / BullMQ: Publish jobs after commit; API to PostgreSQL: Delete outbox after queue accepts; Worker to PostgreSQL: Sweeper recovers outbox if needed; Worker to Redis / BullMQ: Consume or republish jobs; Worker to Receiver: Signed HTTP; at-least-once</desc>
<rect width="1100" height="621" rx="18" fill="#f8fafc"/>
<text x="32" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Ingest and recovery</text>
<rect x="32" y="75" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Client</text>
<rect x="815" y="75" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">API</text>
<path d="M 295 97 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 92 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="80" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="101" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">POST /v1/events: key or session</text>
<rect x="32" y="135" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">API</text>
<rect x="815" y="135" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">PostgreSQL</text>
<path d="M 295 157 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 152 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="140" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="161" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Transaction: event + deliveries + outbox</text>
<rect x="32" y="195" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">API</text>
<rect x="815" y="195" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Redis / BullMQ</text>
<path d="M 295 217 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 212 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="200" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="221" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Publish jobs after commit</text>
<rect x="32" y="255" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">API</text>
<rect x="815" y="255" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="282" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">PostgreSQL</text>
<path d="M 295 277 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 272 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="260" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Delete outbox after queue accepts</text>
<rect x="32" y="315" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Worker</text>
<rect x="815" y="315" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="342" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">PostgreSQL</text>
<path d="M 295 337 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 332 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="320" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="341" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Sweeper recovers outbox if needed</text>
<rect x="32" y="375" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="402" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Worker</text>
<rect x="815" y="375" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="402" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Redis / BullMQ</text>
<path d="M 295 397 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 392 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="380" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="401" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Consume or republish jobs</text>
<rect x="32" y="435" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="462" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Worker</text>
<rect x="815" y="435" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="462" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Receiver</text>
<path d="M 295 457 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 452 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="440" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="461" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Signed HTTP; at-least-once</text>
<text x="32" y="510" font-family="sans-serif" font-size="16" fill="#334155">No active endpoints: no_recipients, zero deliveries.</text>
<text x="32" y="542" font-family="sans-serif" font-size="16" fill="#334155">After a publish failure, API can return 503 after commit.</text>
<text x="32" y="574" font-family="sans-serif" font-size="16" fill="#334155">Sweeper removes outbox rows only after enqueue; worker records outcomes.</text>
</svg>

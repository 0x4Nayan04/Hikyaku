<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 317" role="img" aria-labelledby="title desc">
<title id="title">System context</title>
<desc id="desc">Producer to Hikyaku API: Bearer key: ingest; Console user to Hikyaku API: Session: manage / ingest; Hikyaku API to Receiver: Signed HTTP via worker</desc>
<rect width="1100" height="317" rx="18" fill="#f8fafc"/>
<text x="32" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">System context</text>
<rect x="32" y="75" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Producer</text>
<rect x="815" y="75" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Hikyaku API</text>
<path d="M 295 97 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 92 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="80" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="101" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Bearer key: ingest</text>
<rect x="32" y="135" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Console user</text>
<rect x="815" y="135" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Hikyaku API</text>
<path d="M 295 157 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 152 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="140" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="161" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Session: manage / ingest</text>
<rect x="32" y="195" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="157" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Hikyaku API</text>
<rect x="815" y="195" width="250" height="43" rx="9" fill="#e0e7ff" stroke="#6366f1"/><text x="940" y="222" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e1b4b">Receiver</text>
<path d="M 295 217 H 802" stroke="#475569" stroke-width="2"/><path d="M 795 212 l 8 5 -8 5" fill="none" stroke="#475569" stroke-width="2"/><rect x="355" y="200" width="385" height="32" rx="5" fill="#f8fafc"/><text x="547" y="221" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Signed HTTP via worker</text>
<text x="32" y="270" font-family="sans-serif" font-size="16" fill="#334155">Outbound delivery is at-least-once; receivers should deduplicate.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 345" role="img" aria-labelledby="title desc">
<title id="title">System context</title><desc id="desc">A producer uses a bearer key and a console user uses a session to enter the Hikyaku API and worker system. Hikyaku sends signed HTTP requests to a receiver at least once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#0f172a} .heading{font-size:22px;font-weight:700;fill:#1e3a5f} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .name{font-size:16px;font-weight:650;fill:#1e3a5f} .small{font-size:13px;fill:#475569} .label{font-size:13px;fill:#1e3a5f} .line{fill:none;stroke:#2563a8;stroke-width:1.7;marker-end:url(#arrow)} .rel{fill:none;stroke:#64748b;stroke-width:1.4} .life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 5}</style>
<rect width="740" height="345" fill="white"/>
<text x="28" y="38" class="heading">System context</text>
<rect x="245" y="78" width="250" height="240" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="name" x="370" y="106" text-anchor="middle">Hikyaku system</text>
<rect class="node" x="35" y="140" width="150" height="58" rx="7"/><text class="name" x="110.0" y="169.0" text-anchor="middle" dominant-baseline="middle">Producer</text>
<rect class="node" x="35" y="245" width="150" height="58" rx="7"/><text class="name" x="110.0" y="274.0" text-anchor="middle" dominant-baseline="middle">Console user</text>
<rect class="node" x="280" y="158" width="180" height="70" rx="7"/><text class="name" x="370.0" y="183" text-anchor="middle" dominant-baseline="middle">API + worker</text><text class="small" x="370.0" y="206" text-anchor="middle">Ingest and delivery</text>
<rect class="node" x="555" y="165" width="150" height="58" rx="7"/><text class="name" x="630.0" y="194.0" text-anchor="middle" dominant-baseline="middle">Receiver</text>
<path class="line" d="M185 169H280"/>
<text class="label" x="230" y="158" text-anchor="middle">Bearer key</text>
<path class="line" d="M185 274H225V208H280"/>
<text class="label" x="212" y="294" text-anchor="start">Session</text>
<path class="line" d="M460 193H555"/>
<text class="label" x="507" y="181" text-anchor="middle">Signed HTTP</text>
<text class="small" x="507" y="239" text-anchor="middle">At least once</text>
</svg>

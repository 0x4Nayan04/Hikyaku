name: hikyaku
x-app: &app
  build:
    context: .
    target: runtime
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://webhook:${POSTGRES_PASSWORD:?Run node deploy/setup.mjs}@postgres:5432/webhooks
    REDIS_URL: redis://redis:6379
    DB_POOL_MAX: ${DB_POOL_MAX:-10}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node deploy/setup.mjs}
      POSTGRES_DB: webhooks
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webhook -d webhooks']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?Run node deploy/setup.mjs}
      SESSION_SECRET: ${SESSION_SECRET:?Run node deploy/setup.mjs}
      WEB_APP_URL: https://${SITE_ADDRESS:-localhost}
      CORS_ORIGIN: https://${SITE_ADDRESS:-localhost}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_COOKIE_MAX_AGE: ${SESSION_COOKIE_MAX_AGE:-604800000}
      INVITE_TTL_MS: ${INVITE_TTL_MS:-604800000}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
    command: ['node', 'apps/api/dist/index.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    environment:
      <<: *app-env
      DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-30000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      # Production stack keeps its existing 30s recovery interval (code default: 5m).
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-30000}
    command: ['node', 'apps/worker/dist/index.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

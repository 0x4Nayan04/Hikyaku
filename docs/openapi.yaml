            tenant_id:
              type: string
              format: uuid
            email:
              type: string
              format: email
              maxLength: 320
              description: Trimmed and lowercased before use.
            name:
              type: string
              minLength: 1
              maxLength: 256
              description: Trimmed before validation.
      discriminator:
        propertyName: kind
    Invite:
      type: object
      required:
        - kind

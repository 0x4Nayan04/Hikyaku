  responses:
    BadRequest:
      description:
        Invalid request, filter, JSON, or operation state. Codes include validation_error,
        invalid_json, immutable_field and invalid_state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description:
        Missing/invalid credentials, session or bootstrap secret. Codes include unauthorized,
        invalid_credentials and invalid_admin_secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description:
        'Origin is not allowed, insufficient privileges, or bootstrap is disabled. Codes: origin_not_allowed,
        forbidden.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description:
        Resource not found in the authenticated workspace; malformed resource UUIDs also return
        404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description:
        Conflicting state. Codes include idempotency_mismatch, already_revoked, conflict, workspace_has_admin,
        cannot_delete_self, cannot_delete_admin and last_tenant_user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description:
        'One-time link expired or already consumed. Codes: invite_used, invite_expired, reset_used,
        reset_expired.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: JSON body exceeds 256 KiB; code payload_too_large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description:
        Fixed-window limit exceeded; code rate_limited. Limits are configurable; no Retry-After
        header is promised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description:
        Redis rate-limit or enqueue failure; code service_unavailable. A delivery transaction
        may already be committed. Retry ingest using the same idempotency key and body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error; code internal_error. No internal details are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
